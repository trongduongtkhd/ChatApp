<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>ChatApp – Tạo nhóm</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="ca-app" style="position: relative; min-height: 800px">
<div class="ca-shell" aria-hidden="true">
<aside class="ca-side"><div class="ca-side-head"><h1 class="ca-h1">Đoạn chat</h1></div>
<div class="ca-list">
<div class="ca-item active"><span class="ca-avatar">ĐA</span><span class="txt"><div class="name">Đồ án Phân tán</div><div class="prev">Bạn: Nhớ mang laptop</div></span></div>
<div class="ca-item"><span class="ca-avatar">GĐ</span><span class="txt"><div class="name">Gia đình</div><div class="prev">Mẹ: Cuối tuần về ăn cơm nhé</div></span></div>
</div></aside>
<main class="ca-main"></main>
</div>

<div class="ca-scrim">
<div class="ca-dialog" role="dialog" aria-modal="true" aria-labelledby="cg-title">
<div class="ca-dialog-head">
<h2 class="ca-h2" id="cg-title">Tạo nhóm mới</h2>
<button class="ca-iconbtn" type="button" aria-label="Đóng"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
<div class="ca-dialog-body">
<div class="ca-field"><label for="gn">Tên nhóm</label><input id="gn" type="text" value="Ôn thi cuối kỳ"></div>
<div class="ca-field"><label for="gd">Mô tả (không bắt buộc)</label><textarea id="gd">Cùng ôn môn Ứng dụng phân tán</textarea></div>
<div class="ca-field">
<label for="gm">Thêm thành viên</label>
<input id="gm" type="search" placeholder="Tìm theo tên hoặc tên đăng nhập" value="la">
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span class="ca-chip" style="height: 28px; gap: 6px">Trần Thị Lan<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span>
<span class="ca-chip" style="height: 28px; gap: 6px">Lê Văn Minh<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 4px">
<div class="ca-item" style="min-height: 52px"><span class="ca-avatar md">L</span><span class="txt"><div class="name">Trần Thị Lan</div><div class="prev">@lan</div></span><span style="color: var(--brand)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span></div>
<div class="ca-item" style="min-height: 52px"><span class="ca-avatar md">L</span><span class="txt"><div class="name">Phạm Ngọc Lan</div><div class="prev">@lan1</div></span></div>
</div>
</div>
<div class="ca-dialog-foot">
<button class="ca-btn secondary" type="button">Hủy</button>
<button class="ca-btn primary" type="button">Tạo nhóm</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
