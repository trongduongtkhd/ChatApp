<text x="80" y="1063.12" font-family="Arial, sans-serif" font-size="18" text-anchor="start" fill="#5B6E82">Mode thay thế: Nginx → 2 Chat container (:5003 / :5013). Chỉ một mode Chat phục vụ nguồn tại một thời điểm.</text>
<text x="50" y="1240.62" font-family="Arial, sans-serif" font-size="18" text-anchor="start" fill="#5B6E82">GIỚI HẠN: một máy / một node kind; Mongo replica set một node; Kafka / Redis / kho file chưa HA. Standby không tự failover. Backup local chưa bảo vệ mất toàn máy.</text>
