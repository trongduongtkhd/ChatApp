<div class="ca-scrim" (click)="close()">
  <form class="ca-dialog" role="dialog" aria-modal="true" aria-labelledby="eg-title"
        [formGroup]="form" (ngSubmit)="save()" (click)="$event.stopPropagation()" novalidate>
    <div class="ca-dialog-head">
      <h2 class="ca-h2" id="eg-title">Sửa thông tin nhóm</h2>
      <button class="ca-iconbtn" type="button" aria-label="Đóng" (click)="close()" [disabled]="saving">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
    </div>

    <div class="ca-dialog-body">
      <div *ngIf="reloading" class="ca-loading"><span class="ca-spin"></span>Đang kiểm tra bản mới nhất…</div>

      <!-- 409 Conflict (EditConflict.dc.html) -->
      <div *ngIf="conflict" class="ca-alert warn" role="alert">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div><strong>Nhóm vừa được người khác sửa.</strong> Thay đổi của bạn chưa được lưu để không ghi đè lên họ.</div>
          <div style="font-size: 13px; line-height: 18px; color: var(--ink-muted)">Tên hiện tại: <strong style="color: var(--ink)">{{ conflict.name }}</strong></div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap">
            <button class="ca-btn secondary" type="button" style="height: 36px; font-size: 14px" (click)="reloadLatest()">Tải lại bản mới</button>
          </div>
        </div>
      </div>

      <div *ngIf="error" class="ca-alert error" role="alert">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
        <span>{{ error }}</span>
      </div>

      <div class="ca-field" [class.invalid]="fieldError('name')">
        <label for="en">Tên nhóm</label>
        <input #nameInput id="en" type="text" formControlName="name" [attr.aria-invalid]="!!fieldError('name')" aria-describedby="en-msg">
        <span *ngIf="fieldError('name') as e" class="err" id="en-msg">{{ e }}</span>
      </div>
      <div class="ca-field" [class.invalid]="fieldError('description')">
        <label for="ed">Mô tả</label>
        <textarea id="ed" formControlName="description" aria-describedby="ed-msg"></textarea>
        <span *ngIf="fieldError('description') as e" class="err" id="ed-msg">{{ e }}</span>
      </div>
    </div>

    <div class="ca-dialog-foot">
      <button class="ca-btn secondary" type="button" (click)="close()" [disabled]="saving">Hủy</button>
      <!-- Đang có xung đột chưa xử lý → không cho lưu (bấm "Tải lại bản mới" trước). -->
      <button class="ca-btn primary" type="submit" [disabled]="saving || reloading || !!conflict">
        <span *ngIf="saving" class="ca-spin"></span>{{ saving ? 'Đang lưu…' : 'Lưu thay đổi' }}
      </button>
    </div>
  </form>
</div>
