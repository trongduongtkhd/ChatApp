<div class="ca-app">
  <app-rail></app-rail>

  <main class="ca-page">
    <div class="ca-page-body">
      <h1 class="ca-h1">Cài đặt</h1>

      <section class="ca-card" aria-labelledby="st-profile">
        <h2 class="ca-h2" id="st-profile">Hồ sơ</h2>
        <div class="ca-profile" *ngIf="user">
          <app-avatar [name]="user.displayName" size="lg"></app-avatar>
          <div>
            <div class="name">{{ user.displayName }}</div>
            <div class="ca-meta">&#64;{{ user.userName }}</div>
          </div>
        </div>
        <p class="ca-meta" style="margin: 0">Thông tin lấy từ tài khoản đăng nhập, hiện chỉ xem được.</p>
        <div>
          <button class="ca-btn secondary" type="button" (click)="logout()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
            Đăng xuất
          </button>
        </div>
      </section>

      <section class="ca-card" aria-labelledby="st-theme">
        <h2 class="ca-h2" id="st-theme">Giao diện</h2>
        <!-- Radio thật: dùng phím ← → để đổi, trình đọc màn hình đọc đúng "1 trong 3" -->
        <div class="ca-options" role="radiogroup" aria-labelledby="st-theme" *ngIf="preference$ | async as current">
          <label *ngFor="let o of options" class="ca-option" [class.checked]="current === o.value" [title]="o.hint">
            <input type="radio" name="theme" [value]="o.value" [checked]="current === o.value" (change)="choose(o.value)">
            <ng-container [ngSwitch]="o.value">
              <svg *ngSwitchCase="'light'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
              <svg *ngSwitchCase="'dark'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path></svg>
              <svg *ngSwitchCase="'system'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
            </ng-container>
            {{ o.label }}
          </label>
        </div>
        <p class="ca-meta" style="margin: 0">“Hệ thống” tự đổi theo cài đặt sáng/tối của Windows. Lựa chọn được lưu trên trình duyệt này.</p>
      </section>
    </div>
  </main>
</div>
