<div class="auth">
  <section class="auth-brand">
    <div class="logo">ChatApp</div>
    <div
      style="display: flex; flex-direction: column; gap: 20px; max-width: 400px"
    >
      <h2>Tạo tài khoản, vào nhóm ngay.</h2>
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 14px;
          font-size: 16px;
          line-height: 22px;
        "
      >
        <div style="display: flex; gap: 12px; align-items: center">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M13 2 3 14h9l-1 8 10-12h-9z"></path></svg
          >Tin nhắn thời gian thực
        </div>
        <div style="display: flex; gap: 12px; align-items: center">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path>
            <path d="M21 3v5h-5"></path></svg
          >Tự kết nối lại khi mất mạng
        </div>
        <div style="display: flex; gap: 12px; align-items: center">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg
          >Mật khẩu được mã hóa an toàn
        </div>
      </div>
    </div>
  </section>

  <section class="auth-form-wrap">
    <form
      class="auth-form"
      style="max-width: 400px; gap: 16px"
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
    >
      <h1 class="ca-h1">Đăng ký</h1>

      <div *ngIf="error" class="ca-alert error" role="alert">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 8v4"></path>
          <path d="M12 16h.01"></path>
        </svg>
        <span>{{ error }}</span>
      </div>

      <div class="ca-field" [class.invalid]="errorOf('displayName')">
        <label for="dn">Tên hiển thị</label>
        <input
          id="dn"
          type="text"
          formControlName="displayName"
          autocomplete="name"
          autofocus
          [attr.aria-invalid]="!!errorOf('displayName')"
          aria-describedby="dn-msg"
        />
        <span
          *ngIf="errorOf('displayName') as e; else dnHint"
          class="err"
          id="dn-msg"
          >{{ e }}</span
        >
        <ng-template #dnHint
          ><span class="hint" id="dn-msg"
            >Tên mọi người sẽ thấy trong khung chat.</span
          ></ng-template
        >
      </div>

      <div class="ca-field" [class.invalid]="errorOf('userName')">
        <label for="un">Tên đăng nhập</label>
        <input
          id="un"
          type="text"
          formControlName="userName"
          autocomplete="username"
          [attr.aria-invalid]="!!errorOf('userName')"
          aria-describedby="un-msg"
        />
        <span *ngIf="errorOf('userName') as e" class="err" id="un-msg">{{
          e
        }}</span>
      </div>

      <div class="ca-field" [class.invalid]="errorOf('email')">
        <label for="em">Email</label>
        <input
          id="em"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="!!errorOf('email')"
          aria-describedby="em-msg"
        />
        <span *ngIf="errorOf('email') as e" class="err" id="em-msg">{{
          e
        }}</span>
      </div>

      <div class="ca-field" [class.invalid]="errorOf('password')">
        <label for="pw">Mật khẩu</label>
        <input
          id="pw"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [attr.aria-invalid]="!!errorOf('password')"
          aria-describedby="pw-msg"
        />
        <span
          *ngIf="errorOf('password') as e; else pwHint"
          class="err"
          id="pw-msg"
          >{{ e }}</span
        >
        <ng-template #pwHint
          ><span class="hint" id="pw-msg">Tối thiểu 6 ký tự.</span></ng-template
        >
      </div>

      <button class="ca-btn primary full" type="submit" [disabled]="loading">
        <span *ngIf="loading" class="ca-spin"></span>
        {{ loading ? "Đang tạo tài khoản…" : "Tạo tài khoản" }}
      </button>

      <div class="switch">
        Đã có tài khoản? <a routerLink="/auth/login">Đăng nhập</a>
      </div>
    </form>
  </section>
</div>
