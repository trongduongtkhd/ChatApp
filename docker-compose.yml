# Hạ tầng ChatApp. Chạy: docker compose up -d
# Biến ${...} lấy từ file .env cùng thư mục.

name: chatapp

# Khai báo chung cho MỌI bản chat-service (Phần 8). "x-..." là phần mở rộng, Compose không coi là service.
# &chat-service đặt tên (anchor) cho khối này; các service bên dưới chép lại bằng "<<: *chat-service"
# rồi chỉ ghi phần riêng (tên container, cổng). Thêm bản thứ 3 = thêm 4 dòng.
x-chat-service: &chat-service
  build:
    context: ./backend
    dockerfile: src/Services/Chat/ChatApp.ChatService/Dockerfile
  # 2 bản dùng CHUNG một image: cùng code, khác tiến trình (giống chạy 2 lần một file exe).
  image: chatapp/chat-service
  environment:
    # Biến môi trường ghi đè appsettings.json; "__" thay cho ":" (Kafka__BootstrapServers = Kafka:BootstrapServers).
    # Trong mạng Docker gọi nhau bằng TÊN container (Docker DNS), không dùng localhost:
    # localhost trong container là chính container đó.
    ConnectionStrings__ChatDb: Host=postgres;Port=5432;Database=chat_db;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ConnectionStrings__Redis: redis:6379
    Kafka__BootstrapServers: kafka:29092
    # group-service vẫn chạy trên Windows → host.docker.internal = "máy Windows" nhìn từ trong container (Docker Desktop).
    GrpcServices__GroupService: http://host.docker.internal:5012
    # Cùng secret với user-secrets → token do identity (chạy local) cấp vẫn hợp lệ ở đây.
    Jwt__Secret: ${JWT_SECRET}
    # Redis Backplane, mặc định bật. Demo tắt (PowerShell):
    #   $env:CHAT_BACKPLANE="false"; docker compose up -d chat-service-1 chat-service-2
    # Bật lại: Remove-Item Env:CHAT_BACKPLANE; docker compose up -d chat-service-1 chat-service-2
    SignalR__RedisBackplane: ${CHAT_BACKPLANE:-true}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
  networks:
    - chatapp-net

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Script trong /docker-entrypoint-initdb.d chỉ chạy khi volume còn trống
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chatapp-net

  redis:
    image: redis:7.4-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chatapp-net

  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft: 1 node vừa là broker (giữ message) vừa là controller (giữ metadata), không cần ZooKeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 3 listener: INTERNAL cho container trong Docker, EXTERNAL cho app chạy trên Windows (dotnet run)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Chỉ có 1 broker nên replication factor của topic hệ thống phải là 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Tắt tự tạo topic: gõ sai tên topic thì báo lỗi ngay, không lặng lẽ tạo topic rác 1 partition.
      # Topic được tạo có chủ đích bởi container kafka-init bên dưới.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Cố định Cluster ID để khởi động lại vẫn dùng được dữ liệu cũ trong volume
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - chatapp-net

  # Container chạy MỘT LẦN: tạo topic theo DESIGN mục 4 rồi thoát (exit 0).
  # --if-not-exists → chạy lại bao nhiêu lần cũng được (topic đã có thì bỏ qua, không mất dữ liệu).
  # Số partition: chat.message-sent 3 (chia tải cho nhiều consumer), các topic khác 1.
  # Replication factor 1 vì chỉ có 1 broker.
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29092
        $$T --bootstrap-server $$B --create --if-not-exists --topic identity.user-registered --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic identity.friendship-changed --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic group.member-added      --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic group.member-removed    --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic chat.message-sent       --partitions 3 --replication-factor 1
        echo "Danh sach topic:"
        $$T --bootstrap-server $$B --list
    restart: "no"
    networks:
      - chatapp-net

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: chatapp
      # Gọi Kafka bằng tên container (DNS nội bộ Docker), qua listener INTERNAL
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - chatapp-net

  # 2 bản chat-service chạy trong container (Phần 8). Các service khác vẫn chạy bằng dotnet run trên Windows.
  # Build lại sau khi sửa code: docker compose up -d --build chat-service-1 chat-service-2
  # Cổng 5003/5013 trên Windows → 8080 trong container: để demo nối THẲNG vào từng bản.
  chat-service-1:
    <<: *chat-service
    container_name: chat-service-1
    ports:
      - "5003:8080"

  chat-service-2:
    <<: *chat-service
    container_name: chat-service-2
    ports:
      - "5013:8080"

  # Load balancer chia kết nối cho 2 bản chat-service. Gateway (chạy trên Windows) gọi localhost:5080.
  # Sửa nginx.conf xong: docker compose restart nginx
  nginx:
    image: nginx:1.29-alpine
    container_name: nginx
    ports:
      - "5080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # Không chờ "healthy": nginx tự phân giải tên lúc chạy (resolve), bản nào chưa lên thì chưa được chia tới.
    depends_on:
      - chat-service-1
      - chat-service-2
    networks:
      - chatapp-net

networks:
  chatapp-net:
    name: chatapp-net

volumes:
  postgres-data:
  redis-data:
  kafka-data:
