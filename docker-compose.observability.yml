name: chatapp-observability
services:
  seq:
    image: datalust/seq:2025.2
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports: ["127.0.0.1:5341:80"]
    volumes: ["seq-data:/data"]
    networks: [monitoring]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d", "--web.enable-lifecycle"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infra/backups/runtime/chapter8:/targets:ro
      - prometheus-data:/prometheus
    networks: [monitoring]
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./infra/observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoring]
networks:
  monitoring: {}
volumes:
  seq-data: {}
  prometheus-data: {}
  grafana-data: {}
