global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: chatapp-local
    honor_labels: true
    static_configs:
      - targets: [host.docker.internal:5000, host.docker.internal:5001, host.docker.internal:5002, host.docker.internal:5004, host.docker.internal:5005]
  - job_name: chatapp-pods
    honor_labels: true
    file_sd_configs:
      - files: [/targets/pod-targets.json]
        refresh_interval: 5s
  - job_name: kubernetes-resources
    static_configs:
      - targets: [host.docker.internal:18080]
