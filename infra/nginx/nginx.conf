# Nginx: load balancer đứng trước 2 bản chat-service (Phần 8).
#   Gateway (Windows, :5000) ──► nginx (localhost:5080 → container :80) ──► chat-service-1:8080 / chat-service-2:8080
# Gateway chỉ biết MỘT địa chỉ (nginx); thêm/bớt bản chat-service chỉ sửa file này, Gateway không đổi.

# 1 worker: mỗi worker giữ bộ đếm round-robin riêng → 1 worker cho thứ tự chia đều dễ quan sát khi demo.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # DNS nội bộ của Docker (luôn ở 127.0.0.11 trong mọi container). valid=5s: hỏi lại tên container mỗi 5 giây.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream chat {
        # zone: vùng nhớ chung để lưu danh sách server (bắt buộc khi dùng "resolve").
        zone chat 64k;
        # Mặc định round-robin: request lần lượt bản 1, bản 2, bản 1...
        # resolve: phân giải tên container lúc chạy (không chỉ lúc khởi động) → một bản đang tắt (không có tên trong DNS)
        #          thì nginx vẫn khởi động được; bản đó bật lại (có thể khác IP) thì tự được dùng lại.
        # max_fails=1 fail_timeout=10s: kết nối tới bản nào lỗi 1 lần → bỏ qua bản đó 10 giây rồi mới thử lại
        #          (health check BỊ ĐỘNG: chỉ biết bản chết khi request thật gặp lỗi).
        server chat-service-1:8080 resolve max_fails=1 fail_timeout=10s;
        server chat-service-2:8080 resolve max_fails=1 fail_timeout=10s;
    }

    # WebSocket bắt đầu bằng 1 request HTTP có "Upgrade: websocket". Proxy phải chuyển tiếp 2 header này,
    # nếu không bản chat-service chỉ thấy request HTTP thường và không "nâng cấp" lên WebSocket được.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Log mỗi request: đi tới bản nào ($upstream_addr). Dùng $uri (KHÔNG có query string)
    # để không ghi ?access_token=... (JWT) vào log.
    log_format chat '$remote_addr $request_method $uri $status → $upstream_addr ${request_time}s';
    access_log /dev/stdout chat;

    server {
        listen 80;

        location / {
            proxy_pass http://chat;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Kết nối WebSocket sống lâu: nginx mặc định đóng sau 60 giây không có dữ liệu.
            # SignalR ping mỗi 15 giây nên không bị đóng; đặt 120s cho dư.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Mở kết nối tới một bản quá 2 giây hoặc bị từ chối → thử bản còn lại (cùng request, client không biết).
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout;

            # Trả về cho client biết request vừa được bản nào xử lý (để demo chia tải).
            add_header X-Chat-Upstream $upstream_addr always;
        }
    }
}
